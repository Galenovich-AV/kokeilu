<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Suomi-muistikirja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
/* Layout: one long notebook page on dotted paper; each task is a paper sheet held by washi tape; vocabulary as tiles; ○ ◐ ✓ mark progress. */
:root{
  --paper:#f5efe3;      /* beige page */
  --sheet:#fcf9f1;      /* paper sheet */
  --tile:#f1eadb;       /* vocabulary tile */
  --tile-line:#e0d5be;
  --head:#3f6328;       /* headings: deep green */
  --kraft:rgba(214,190,145,.8);
  --ink:#2f3a2c;        /* main text, green-tinted near-black */
  --ink-soft:#6b7563;
  --dot:#ddd4bf;        /* dot grid */
  --rule:#e6dfcc;
  --sage:#b9e094;       /* accent: pastel green */
  --sage-ink:#4e7d2f;   /* accent strong enough for text on beige */
  --tape:rgba(185,224,148,.38);
  --ok:#3f7f2a; --ok-bg:#e7f4da;
  --bad:#b5513e; --bad-bg:#f8e3dc;
  --wait:#9a7b2d; --wait-bg:#f5ecd2;
  --shadow:0 1px 0 rgba(60,50,20,.06),0 6px 18px -10px rgba(60,50,20,.25);
  --f-hand:var(--f-body);
  --f-script:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#22261f;--sheet:#2a2f26;--tile:#33392d;--tile-line:#464d3e;--head:#cfe9b3;--kraft:rgba(150,130,95,.55);--ink:#ebe8db;--ink-soft:#a9ad9c;--dot:#3b4135;--rule:#3d4337;
  --sage:#b9e094;--sage-ink:#b9e094;--tape:rgba(185,224,148,.2);
  --ok:#a9db7e;--ok-bg:#2f3f25;--bad:#ef9a85;--bad-bg:#46302a;--wait:#e2c472;--wait-bg:#423a22;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#22261f;--sheet:#2a2f26;--tile:#33392d;--tile-line:#464d3e;--head:#cfe9b3;--kraft:rgba(150,130,95,.55);--ink:#ebe8db;--ink-soft:#a9ad9c;--dot:#3b4135;--rule:#3d4337;
  --sage:#b9e094;--sage-ink:#b9e094;--tape:rgba(185,224,148,.2);
  --ok:#a9db7e;--ok-bg:#2f3f25;--bad:#ef9a85;--bad-bg:#46302a;--wait:#e2c472;--wait-bg:#423a22;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 20px -12px rgba(0,0,0,.6);color-scheme:dark}

/* Dictionary view: ivory paper, soft lilac instead of green, so the switch is obvious */
:root{--on-accent:#1f2c17}
:root.dict-mode{
  --paper:#fbf8f1;--sheet:#fffdf9;--tile:#f3eef6;--tile-line:#e2d8ea;--dot:#e7e1d6;--rule:#ece5ee;
  --sage:#d8c8ef;--sage-ink:#7a5ca3;--head:#5e4683;--tape:rgba(216,200,239,.55);--kraft:rgba(216,200,239,.6);
  --ok-bg:#f1eaf8;--on-accent:#3a2a52}
@media (prefers-color-scheme: dark){:root.dict-mode:not([data-theme="light"]){
  --paper:#25222a;--sheet:#2d2933;--tile:#37323e;--tile-line:#4a4353;--dot:#3c3744;--rule:#433d4b;
  --sage:#c9b5e8;--sage-ink:#cdb8f0;--head:#e2d4f7;--tape:rgba(201,181,232,.25);--kraft:rgba(201,181,232,.3);
  --ok-bg:#3a3247;--on-accent:#2b2038}}
:root.dict-mode[data-theme="dark"]{
  --paper:#25222a;--sheet:#2d2933;--tile:#37323e;--tile-line:#4a4353;--dot:#3c3744;--rule:#433d4b;
  --sage:#c9b5e8;--sage-ink:#cdb8f0;--head:#e2d4f7;--tape:rgba(201,181,232,.25);--kraft:rgba(201,181,232,.3);
  --ok-bg:#3a3247;--on-accent:#2b2038}
/* Teacher view: faint pink paper, pastel sunset accents (rose, coral, apricot) */
:root.teacher-mode{
  --paper:#fbf0ee;--sheet:#fffaf8;--tile:#f8e7e3;--tile-line:#efd3cc;--dot:#efdcd6;--rule:#f2dfd9;
  --sage:#f7c2b5;--sage-ink:#c25d72;--head:#9e4860;--tape:rgba(247,194,181,.55);--kraft:rgba(250,212,166,.75);
  --ok-bg:#fdeee9;--on-accent:#5b2232}
@media (prefers-color-scheme: dark){:root.teacher-mode:not([data-theme="light"]){
  --paper:#2a2224;--sheet:#33292b;--tile:#3d3134;--tile-line:#523f43;--dot:#45383b;--rule:#4a3c3f;
  --sage:#f0a99a;--sage-ink:#f4a7b5;--head:#f8cfd6;--tape:rgba(240,169,154,.25);--kraft:rgba(240,190,140,.3);
  --ok-bg:#45333a;--on-accent:#3a1620}}
:root.teacher-mode[data-theme="dark"]{
  --paper:#2a2224;--sheet:#33292b;--tile:#3d3134;--tile-line:#523f43;--dot:#45383b;--rule:#4a3c3f;
  --sage:#f0a99a;--sage-ink:#f4a7b5;--head:#f8cfd6;--tape:rgba(240,169,154,.25);--kraft:rgba(240,190,140,.3);
  --ok-bg:#45333a;--on-accent:#3a1620}
.teacher-mode .ex::before{background:repeating-linear-gradient(-45deg,var(--sage) 0 12px,var(--kraft) 12px 24px)}
.dict-mode .index,.dict-mode #register,.teacher-mode .index,.teacher-mode #register,.profile-mode .index{display:none}
.dict-hero{margin:14px 0 22px}
.dict-hero p{margin:6px 0 0}
.totop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:22;width:48px;height:48px;border-radius:50%;cursor:pointer;
  background:var(--sage);border:2px solid var(--sage-ink);color:var(--on-accent);box-shadow:0 6px 16px rgba(40,50,30,.22);display:flex;align-items:center;justify-content:center;padding:0}
.totop::before{content:"";width:12px;height:12px;border-left:3px solid currentColor;border-top:3px solid currentColor;transform:translateY(3px) rotate(45deg)}
.totop:hover{filter:brightness(.96)}
.fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.wstat{font-size:.78rem;color:var(--ink-soft);font-weight:600}
.board{margin:0 0 18px}
.board-h{margin:0 0 8px;font-family:var(--f-script);font-size:1.4rem;color:var(--sage-ink)}
.board-h .note{font-family:var(--f-body)}
.oldw{color:var(--sage-ink);font-size:.75rem}
.who-me{cursor:pointer;gap:8px;padding:3px 12px 3px 4px;font:inherit}
.who-me.on{border-color:var(--sage-ink);background:var(--sage)}
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:rgba(40,45,35,.55);object-fit:cover;flex:0 0 auto;overflow:hidden}
.prof-head{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.prof-av .avatar{box-shadow:0 0 0 4px var(--sheet),0 0 0 6px var(--sage)}
.prof-id{min-width:0;flex:1 1 260px}
.prof-id label.btn{display:inline-flex;align-items:center}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--sheet);box-shadow:0 0 0 1.5px var(--tile-line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2.5px var(--sage-ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}
.stat{background:var(--tile);border:1px solid var(--tile-line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat-n{font-size:1.9rem;font-weight:800;color:var(--head);font-variant-numeric:tabular-nums;line-height:1.1}
.stat-n small{font-size:1rem;color:var(--ink-soft);font-weight:700}
.hist{list-style:none;margin:0;padding:0}
.hist-row{display:grid;grid-template-columns:1fr auto auto;gap:6px 16px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--rule)}
.hist-main,.hist-meta{display:flex;flex-direction:column;min-width:0}
.hist-meta{text-align:right}
.hist-score{font-weight:800;font-variant-numeric:tabular-nums}
.hist-score.ok{color:var(--ok)}.hist-score.mid{color:var(--wait)}.hist-score.low{color:var(--bad)}
@media (max-width:560px){.hist-row{grid-template-columns:1fr auto}.hist-meta{text-align:left;grid-column:1}.hist-row .btn{grid-column:2;grid-row:1 / span 2}}
.help-note{margin:0 0 14px}
.prof-card{margin-top:34px}
.learned{color:var(--sage-ink);font-size:.8rem}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;max-width:640px}
.mcol{display:grid;gap:8px;align-content:start}
.mbtn{cursor:pointer;text-align:left;font:inherit;font-weight:700;color:var(--head);background:var(--tile);border:1.5px solid var(--tile-line);border-radius:8px;padding:10px 14px;min-height:46px}
.mbtn.sel{border-color:var(--sage-ink);box-shadow:0 0 0 3px var(--tape)}
.mbtn.bad{border-color:var(--bad);background:var(--bad-bg)}
.mbtn.done{opacity:.45;cursor:default;text-decoration:line-through;background:var(--ok-bg)}
.tr-q{font-size:1.5rem;font-weight:800;color:var(--head);margin:4px 0;letter-spacing:.02em}
.tr-q .gap{display:inline-block;min-width:.8em;text-align:center;color:var(--sage-ink);border-bottom:3px solid var(--sage-ink)}
.tr-res{font-size:1.1rem;margin:12px 0}
.field.one{flex:0 0 64px;text-align:center;font-size:1.3rem;font-weight:800}
.pbar{height:10px;border-radius:999px;background:var(--tile);border:1px solid var(--tile-line);overflow:hidden;margin-top:6px}
.pbar span{display:block;height:100%;background:var(--sage);border-radius:999px}
.prow{padding:10px 0;border-bottom:1px dashed var(--rule)}
.prow-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline}
.hl-pill{display:inline-block;background:var(--sage);color:var(--on-accent);font:inherit;font-weight:700;padding:1px 12px;border:0;border-radius:999px;white-space:nowrap;cursor:pointer}
.hl-pill:hover{filter:brightness(.95)}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{transition:background-color .4s;background:var(--paper);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:22px 22px;
  color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;margin:0}
.wrap{max-width:1020px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
h1,h2,h3,.hand{font-family:var(--f-body);font-weight:800;line-height:1.15;text-wrap:balance;color:var(--head)}
h1{font-size:clamp(2rem,6vw,3rem);margin:0}
.brand{font-weight:800;font-size:.95rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sage-ink)}
.topic-title{font-family:var(--f-script);font-weight:700;font-size:clamp(2.6rem,7vw,3.4rem);line-height:1}
.linkbtn{background:none;border:0;padding:2px 0;cursor:pointer;color:var(--ink-soft);font-size:.9rem;font-weight:600;border-bottom:1px dashed currentColor}
.linkbtn:hover{color:var(--sage-ink)}
.title-slip{display:inline-block;background:var(--sheet);border:1px solid var(--rule);box-shadow:var(--shadow);padding:14px 28px 16px;transform:rotate(-.5deg)}
.title-slip mark{background:var(--tape);color:inherit;padding:0 4px}
h2{font-size:1.9rem;margin:0}
h3{font-size:1.5rem;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--sage-ink);outline-offset:3px}
a{color:var(--sage-ink)}

/* header */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:8px}
.top .sub{color:var(--ink-soft);font-size:.95rem;margin:2px 0 0}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.92rem}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);border-radius:999px;padding:3px 12px;background:var(--sheet)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--wait)}
.chip.cloud .dot{background:var(--ok)}
.tape{position:relative;display:inline-block;padding:2px 14px 0;z-index:0}
.tape::before{content:"";position:absolute;inset:30% -4px 6% -4px;background:var(--tape);transform:rotate(-.8deg);z-index:-1;border-radius:2px;
  -webkit-mask:linear-gradient(90deg,transparent 0 3px,#000 3px calc(100% - 3px),transparent 0);mask:linear-gradient(90deg,transparent 0 3px,#000 3px calc(100% - 3px),transparent 0)}

/* index of topics */
.index{margin:18px 0 22px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);padding:10px 0}
.index-row{display:block}
.toc{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:8px}
.toc-topic{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px}
.toc-topic.soon{color:var(--ink-soft)}
.toc .sig{display:inline-block;width:1.4em;font-size:1.05rem;font-weight:700;color:var(--sage-ink);line-height:1}
.toc-count{font-size:.85rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.toc-blocks{list-style:none;margin:2px 0 4px;padding:0 0 0 1.6em;display:grid;gap:2px;flex-basis:100%}
.toc-blocks li{display:flex;flex-wrap:wrap;gap:0 12px;align-items:baseline}
.toc-blocks a{color:var(--ink);text-decoration:none;border-bottom:1px dashed var(--ink-soft)}
.toc-blocks a:hover{border-bottom-color:var(--sage-ink)}
.toc-blocks li.is-done a{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--sage-ink)}
.toc-legend{margin:6px 0 0}
.ex-state{font-size:.85rem;color:var(--ink-soft);font-weight:600}
.ex-state.done{color:var(--ok)}
.block{scroll-margin-top:12px}
.index-label{font-family:var(--f-hand);font-size:1.4rem;font-weight:700;margin-right:6px}
.topic-btn{background:none;border:0;padding:2px 0;cursor:pointer;border-bottom:2px solid transparent;font-weight:600}
.topic-btn[aria-current="true"]{border-color:var(--sage-ink)}
.topic-btn:disabled{color:var(--ink-soft);cursor:default;font-weight:400}

/* block tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 20px}
.tab{cursor:pointer;border:1.5px solid var(--ink);background:var(--sheet);border-radius:var(--r);padding:8px 14px;display:flex;gap:10px;align-items:baseline;font-weight:700}
.block{margin:0 0 12px}
.block-title{margin:40px 0 34px;font-family:var(--f-script);font-size:2.6rem}
.block-title .note{font-family:var(--f-body);font-size:.95rem;font-weight:400}
.tab small{font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--sage);color:#22301a;border-color:#22301a}
.tab[aria-selected="true"] small{color:#33461f}

/* exercise card */
.ex{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow);padding:34px 28px 24px;margin:0 0 40px;position:relative}
.ex::before{content:"";position:absolute;top:-16px;left:48px;width:min(220px,40%);height:34px;transform:rotate(-3deg);opacity:.9;
  background:repeating-linear-gradient(-45deg,var(--sage) 0 12px,color-mix(in srgb,var(--sage) 55%,var(--sheet)) 12px 24px);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ex:nth-child(even)::before{left:auto;right:40px;width:min(210px,38%);transform:rotate(3deg);background:var(--kraft)}
.ex-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.ex-head .sig{color:var(--head);margin-right:2px}
.ex-task{color:var(--ink-soft);font-style:italic;margin:2px 0 20px;max-width:65ch}
.score{font-family:var(--f-script);font-size:1.6rem;font-weight:700;padding:0 10px;border:2px solid currentColor;border-radius:8px;transform:rotate(-3deg);font-variant-numeric:tabular-nums}
.score.ok{color:var(--ok)} .score.mid{color:var(--wait)} .score.low{color:var(--bad)}
.saved-note{font-size:.85rem;color:var(--ink-soft)}

/* flashcards */
.vgroup{margin:0 0 18px}
.vgroup h4{margin:0 0 6px;font-family:var(--f-script);font-weight:700;color:var(--sage-ink);font-size:1.45rem}
.vgroup h4 .note{font-family:var(--f-body);font-style:normal;font-size:.82rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 16px}
.card{display:block;width:100%;perspective:900px;height:78px;cursor:pointer;border:0;background:none;padding:0;text-align:left;font:inherit}
.card-in{display:block;position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.card.flipped .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7px;display:flex;flex-direction:column;justify-content:center;padding:6px 16px;
  border:1.5px solid var(--tile-line);background:var(--tile);box-shadow:0 1px 0 rgba(60,50,20,.05)}
.face.back{transform:rotateY(180deg);background:var(--sage);border-color:var(--sage);color:#1f2c17}
.face .w{font-weight:700;font-size:1rem;line-height:1.25;color:var(--head)}
.face.back .w{color:#1f2c17}
.face .g{font-size:.8rem;color:var(--ink-soft);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face.back .g{color:#33461f}
.card:hover .face.front{border-color:var(--sage-ink)}
.card.indict .face{border:2.5px solid #5d9a2f;box-shadow:0 0 0 3px rgba(185,224,148,.75)}
.card.indict .face.front::before{content:"в словаре";position:absolute;top:-9px;right:10px;font-size:.66rem;font-weight:800;letter-spacing:.04em;padding:0 6px;border-radius:999px;background:#5d9a2f;color:#fff}
.card.known .face.front{background:var(--sheet);border-style:dashed}
.card.known .face.front::after{content:"✓";position:absolute;top:50%;right:12px;transform:translateY(-50%);font-weight:700;color:var(--ok)}
.card-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}

/* bank, items */
.bank{border:1.5px dashed var(--sage-ink);border-radius:8px;padding:4px 12px;margin-bottom:16px;width:fit-content;max-width:100%}
.bank[open]{width:auto}
.bank summary{cursor:pointer;font-size:.92rem;font-weight:700;color:var(--sage-ink);list-style:none}
.bank summary::before{content:"› ";display:inline-block;transition:transform .2s}
.bank[open] summary::before{transform:rotate(90deg)}
.bank-words{display:flex;flex-wrap:wrap;gap:6px 10px;padding:6px 0 4px}
.bank-words span{padding:0 8px;background:var(--paper);border-radius:4px}
ol.items{list-style:none;margin:0;padding:0;counter-reset:it;display:grid;gap:12px}
ol.items>li{counter-increment:it;display:grid;grid-template-columns:2.2em 1fr;gap:4px;align-items:start}
ol.items>li::before{content:counter(it)".";font-family:var(--f-script);font-size:1.45rem;line-height:1.3;color:var(--sage-ink);font-weight:700}
.it-body{min-width:0}
.blank{display:inline-block;min-width:8.5em;max-width:100%;border:0;border-bottom:2px solid var(--ink-soft);background:transparent;padding:0 4px;margin:0 2px;font-weight:700}
.blank.wide{width:100%;min-width:0}
.blank:focus{outline:none;border-bottom-color:var(--sage-ink);background:var(--ok-bg)}
.blank.ok{border-bottom-color:var(--ok);color:var(--ok)}
.blank.bad{border-bottom-color:var(--bad);color:var(--bad)}
.hint{color:var(--ink-soft);font-style:italic}
.fb{display:block;font-size:.9rem;margin-top:3px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)} .fb.wait{color:var(--wait)}
.fb .why{color:var(--ink-soft)}
.symptoms{background:var(--paper);border-left:3px solid var(--sage);padding:4px 10px;margin-bottom:6px;border-radius:0 6px 6px 0}

.part-actions{margin:14px 0 26px;padding-top:12px;border-top:1px dashed var(--rule)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.btn{cursor:pointer;border:2px solid var(--sage-ink);background:transparent;color:var(--head);border-radius:999px;padding:7px 20px;font-family:var(--f-body);font-weight:700;font-size:.98rem}
.btn.main{background:var(--sage);color:var(--on-accent);border-color:var(--sage)}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.small{padding:4px 14px;font-size:.9rem;border-width:1.5px}

/* YKI reading */
.yki-text{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:16px 18px;margin:0 0 16px;max-width:70ch}
.yki-text .kind{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.yki-text h4{font-family:var(--f-body);font-size:1.12rem;margin:2px 0 8px}
.yki-text p{margin:0 0 .7em}
.q{margin:0 0 14px}
.q .qt{font-weight:700;margin-bottom:4px}
.opts{display:grid;gap:4px}
.opt{display:flex;gap:8px;align-items:flex-start;cursor:pointer;padding:3px 6px;border-radius:6px}
.opt input{margin-top:6px;accent-color:var(--sage-ink)}
.opt.ok{background:var(--ok-bg)} .opt.bad{background:var(--bad-bg)}
.tf{display:flex;gap:14px;flex-wrap:wrap}
textarea{width:100%;min-height:90px;border:1.5px solid var(--rule);border-radius:8px;padding:10px 12px;background:var(--sheet);line-height:1.55;resize:vertical;
  background-image:linear-gradient(transparent calc(1.55em - 1px),var(--rule) 1px);background-size:100% 1.55em;background-attachment:local;background-position:0 10px}
textarea:focus{outline:none;border-color:var(--sage-ink)}
.section-title{display:flex;gap:10px;align-items:baseline;margin:22px 0 10px}
.section-title .n{font-family:var(--f-script);font-size:1.7rem;font-weight:700;color:var(--sage-ink)}

/* writing */
.wtask{border-top:1px dashed var(--rule);padding-top:16px;margin-top:16px}
.wtask:first-of-type{border-top:0;margin-top:0;padding-top:0}
.wtask ul{margin:6px 0 10px;padding-left:1.2em}
.wmeta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.88rem;color:var(--ink-soft);margin-top:4px}
.count{font-variant-numeric:tabular-nums}
.count.good{color:var(--ok)}
.timer{font-family:var(--f-script);font-size:1.5rem;font-variant-numeric:tabular-nums}
.teacher-fb{margin-top:10px;border:1.5px solid var(--sage-ink);border-radius:8px;padding:10px 12px;background:var(--ok-bg)}
.teacher-fb b{font-weight:800}

/* register / notices */
.panel{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--r);padding:18px 20px;margin:0 0 22px;box-shadow:var(--shadow)}
.panel p{margin:.3em 0}
.panel.notice{border-color:var(--sage-ink);background:var(--ok-bg)}
.panel.notice h3{margin-bottom:6px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{border:1.5px solid var(--ink-soft);border-radius:8px;padding:8px 12px;background:var(--paper);min-width:0;flex:1 1 220px}
.note{font-size:.9rem;color:var(--ink-soft)}
.warn{background:var(--wait-bg);border:1px solid var(--wait);border-radius:8px;padding:8px 12px;font-size:.92rem}

/* teacher */
.st{border-top:1px solid var(--rule);padding:10px 0}
.st summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-weight:700;list-style:none}
.st summary::before{content:"›";font-family:var(--f-hand);font-size:1.4rem;transition:transform .2s;display:inline-block}
.st[open] summary::before{transform:rotate(90deg)}
.st summary .note{font-weight:400}
.res-table{width:100%;border-collapse:collapse;font-size:.92rem}
.res-table td,.res-table th{border-bottom:1px solid var(--rule);padding:5px 6px;text-align:left;vertical-align:top}
.res-table th{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.scroll{overflow-x:auto}
.mark-ok{color:var(--ok);font-weight:700}.mark-bad{color:var(--bad);font-weight:700}.mark-wait{color:var(--wait);font-weight:700}
.essay{white-space:pre-wrap;background:var(--paper);border-left:3px solid var(--sage);padding:8px 12px;border-radius:0 6px 6px 0;margin:6px 0}
.exr{margin:10px 0 14px}
.exr h5{margin:0 0 4px;font-size:1rem}
.block-head{display:flex;align-items:center;gap:12px}
.fold{cursor:pointer;width:32px;height:32px;flex:0 0 auto;border:1.5px solid var(--sage-ink);border-radius:50%;background:transparent;color:var(--sage-ink);display:inline-flex;align-items:center;justify-content:center;padding:0}
.fold::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(2px) rotate(-135deg);transition:transform .2s}
.collapsed > .block-head .fold::before,.ex.collapsed .fold::before{transform:translateY(-2px) rotate(45deg)}
.block.collapsed [data-exlist]{display:none}
.block.collapsed .block-title{margin-bottom:10px}
.ex.collapsed{padding-bottom:16px}
.ex.collapsed > :not(.ex-head){display:none}
.ex.collapsed .ex-head{margin-bottom:0}
.wsheet{position:fixed;inset:auto 0 0 0;z-index:25;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.wsheet-in{width:min(520px,100%);background:var(--sheet);border:1.5px solid var(--sage-ink);border-radius:14px;box-shadow:0 -6px 30px rgba(40,50,30,.25);padding:16px 18px;display:grid;gap:6px}
.wsheet-in .field{flex:none;width:100%}
.wsheet-in .btn.main{margin-top:8px;justify-self:start}
.dict td{vertical-align:middle}
.back-tools{display:flex;align-items:center;gap:6px;margin-top:6px}
.knowbtn{font-size:.78rem;font-weight:800;padding:3px 10px;border-radius:999px;background:#1f2c17;color:var(--sage);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.knowbtn:hover{background:#33461f}
.knowbtn .short{display:none}
.card-in{container-type:inline-size}
@container (max-width:175px){.knowbtn .long{display:none}.knowbtn .short{display:inline}}
.card.leaving{transition:opacity .25s,transform .25s;opacity:0;transform:scale(.92)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(30,35,25,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-in{background:var(--sheet);border-radius:14px;border:1.5px solid var(--sage-ink);padding:20px 22px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal-in p{margin:.4em 0}
.addw{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1.5px solid #1f2c17;color:#1f2c17;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;line-height:1}
.addw:hover{background:rgba(255,255,255,.5)}
.dict-act{white-space:nowrap;text-align:right}
@media (max-width:560px){.dict thead{display:none}.dict tr{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;border-bottom:1px solid var(--rule);padding:6px 0}.dict td{border:0;padding:2px 4px}.dict-act{flex-basis:100%;text-align:left;white-space:normal}}
.addsel{position:absolute;z-index:24;border-radius:999px;border:2px solid var(--sage-ink);padding:9px 18px;font-size:.98rem;box-shadow:0 6px 18px rgba(40,50,30,.28);white-space:nowrap;max-width:calc(100vw - 16px);overflow:visible}
.addsel:hover{transform:none}
.addsel::after{content:"";position:absolute;left:var(--tail,50%);bottom:-8px;width:12px;height:12px;margin-left:-6px;background:var(--sage);border-right:2px solid var(--sage-ink);border-bottom:2px solid var(--sage-ink);transform:rotate(45deg)}
.addsel.below::after{bottom:auto;top:-8px;transform:rotate(225deg)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-weight:600;font-size:.92rem;z-index:20;width:max-content;max-width:calc(100% - 32px);text-align:center}
@media (max-width:520px){.ex{padding:30px 16px 18px}.cards{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.title-slip{padding:12px 18px}}
@media (prefers-reduced-motion:reduce){.card-in{transition:none}.btn:hover{transform:none}}

/* =========================================================
   STORAGE. Three backends, picked at start:
   · supa  — the Netlify site: Supabase accounts (window.SUPABASE_CONFIG from config.js)
   · cloud — the claude.ai page: artifact db
   · local — nothing else available: this browser only
   claude.ai db layout:  results/<uid> profile · results/<uid>/ex/<key> · results/<uid>/fb/<key>
   Supabase tables:      profiles · results · feedback · teachers (see supabase.sql)
   ========================================================= */
const LS_KEY = 'suomi-muistikirja:v1';
const lsRead = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; } };
const lsWrite = s => { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) {} };
const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js';
const loadScript = src => new Promise((ok, fail) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = fail; document.head.appendChild(sc); });
const rowsToMap = rows => { const out = {}; (rows || []).forEach(r => { out[r.key] = r.data; }); return out; };

const Store = {
  mode: 'local', db: null, sb: null, uid: null, isOwner: false, cloudBlocked: false, recovery: false,
  ready: null,
  online() { return (this.mode === 'cloud' && !this.cloudBlocked) || (this.mode === 'supa' && !!this.uid); },
  async init() {
    const cfg = window.SUPABASE_CONFIG;
    if (cfg && cfg.url && cfg.anonKey) {
      try {
        if (!window.supabase) await loadScript(SUPABASE_JS);
        this.sb = window.supabase.createClient(cfg.url, cfg.anonKey);
        this.mode = 'supa';
        this.sb.auth.onAuthStateChange((ev, session) => {
          if (ev === 'PASSWORD_RECOVERY') { this.recovery = true; renderRegister(); }
          const id = session ? session.user.id : null;
          if (id !== this.uid && this._booted) setTimeout(() => this.afterAuth(session), 0);
        });
        const { data } = await this.sb.auth.getSession();
        await this.setSession(data.session);
        this._booted = true;
      } catch (e) { this.mode = 'local'; }
      return;
    }
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
        if (db && user) {
          const id = await user.id();
          if (id) { this.db = db; this.uid = id; this.mode = 'cloud'; this.isOwner = await user.isOwner(); }
        }
      }
    } catch (e) { this.mode = 'local'; }
  },
  async setSession(session) {
    this.uid = session ? session.user.id : null;
    this.isOwner = false;
    if (!this.uid) return;
    const { data: teacher } = await this.sb.rpc('is_teacher');
    this.isOwner = teacher === true;
    const { data: prof } = await this.sb.from('profiles').select('name').eq('id', this.uid).maybeSingle();
    const metaName = (session.user.user_metadata || {}).name;
    if (!prof && metaName) await this.sb.from('profiles').upsert({ id: this.uid, name: metaName, updated_at: new Date().toISOString() });
    // results done before logging in on this device go up to the account
    const local = lsRead().results || {};
    const keys = Object.keys(local);
    if (keys.length) {
      const { data: have } = await this.sb.from('results').select('key').eq('user_id', this.uid);
      const exist = new Set((have || []).map(r => r.key));
      const up = keys.filter(k => !exist.has(k)).map(k => ({ user_id: this.uid, key: k, data: local[k], updated_at: local[k].at }));
      if (up.length) await this.sb.from('results').upsert(up);
    }
  },
  async afterAuth(session) {
    await this.setSession(session);
    if (!this.uid) { lsWrite({}); try { localStorage.removeItem(LS_KEY + ':pending'); } catch (e) {} state.view = 'learn'; }
    await loadMine();
  },
  async call(fn, fallback) {
    try { return await fn(); }
    catch (e) {
      if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); try { return await fn(); } catch (e2) {} }
      if (e && e.code === 'invalid_argument') { this.cloudBlocked = true; renderWho(); }
      return fallback ? fallback() : null;
    }
  },
  async getProfile() {
    await this.ready;
    const local = lsRead().profile || null;
    if (this.mode === 'supa') {
      if (!this.uid) return null;
      const { data } = await this.sb.from('profiles').select('name, updated_at').eq('id', this.uid).maybeSingle();
      return data ? { name: data.name } : null;
    }
    if (this.mode !== 'cloud') return local;
    const snap = await this.call(() => this.db.doc('results/' + this.uid).get());
    return (snap && snap.exists) ? snap.data() : local;
  },
  async saveProfile(name) {
    await this.ready;
    const s = lsRead(); s.profile = { name, updatedAt: new Date().toISOString() }; lsWrite(s);
    if (this.mode === 'supa' && this.uid) await this.sb.from('profiles').upsert({ id: this.uid, name, updated_at: s.profile.updatedAt });
    if (this.mode === 'cloud' && !this.cloudBlocked) await this.call(() => this.db.doc('results/' + this.uid).set(s.profile));
  },
  async saveResult(key, doc) {
    await this.ready;
    const s = lsRead(); s.results = s.results || {}; s.results[key] = doc; lsWrite(s);
    if (this.mode === 'supa' && this.uid) {
      let error = null;
      try { ({ error } = await this.sb.from('results').upsert({ user_id: this.uid, key, data: doc, updated_at: doc.at })); } catch (e) { error = e; }
      this.markPending(key, !!error);
      if (!error && state.profile) await this.sb.from('profiles').upsert({ id: this.uid, name: state.profile.name, updated_at: doc.at });
      return !error;
    }
    if (this.mode === 'cloud' && !this.cloudBlocked) {
      await this.call(() => this.db.doc('results/' + this.uid + '/ex/' + key).set(doc));
      if (!this.cloudBlocked && state.profile) await this.call(() => this.db.doc('results/' + this.uid).set({ name: state.profile.name, updatedAt: doc.at }));
    }
    return this.online();
  },
  // results that could not reach the site wait here and go up when the connection is back
  markPending(key, on) {
    let p = []; try { p = JSON.parse(localStorage.getItem(LS_KEY + ':pending')) || []; } catch (e) {}
    p = p.filter(x => x !== key); if (on) p.push(key);
    try { localStorage.setItem(LS_KEY + ':pending', JSON.stringify(p)); } catch (e) {}
  },
  async flushPending() {
    if (this.mode !== 'supa' || !this.uid) return;
    let p = []; try { p = JSON.parse(localStorage.getItem(LS_KEY + ':pending')) || []; } catch (e) {}
    if (!p.length) return;
    const local = lsRead().results || {}; let sent = 0;
    for (const k of p) {
      if (!local[k]) { this.markPending(k, false); continue; }
      try { const { error } = await this.sb.from('results').upsert({ user_id: this.uid, key: k, data: local[k], updated_at: local[k].at }); if (!error) { this.markPending(k, false); sent++; } } catch (e) {}
    }
    if (sent) toast('Несохранённые ответы отправлены на сайт');
  },
  async myResults() {
    await this.ready;
    const local = lsRead().results || {};
    if (this.mode === 'supa') {
      if (!this.uid) return local;
      const { data } = await this.sb.from('results').select('key, data').eq('user_id', this.uid);
      return { ...local, ...rowsToMap(data) };
    }
    if (this.mode !== 'cloud') return local;
    const q = await this.call(() => this.db.collection('results/' + this.uid + '/ex').get());
    if (!q) return local;
    const out = { ...local }; q.docs.forEach(d => { out[d.id] = d.data(); }); return out;
  },
  async feedbackFor(uid) {
    await this.ready;
    if (this.mode === 'supa') {
      const { data } = await this.sb.from('feedback').select('key, data').eq('user_id', uid);
      return rowsToMap(data);
    }
    if (this.mode !== 'cloud') return {};
    const q = await this.call(() => this.db.collection('results/' + uid + '/fb').get());
    const out = {}; if (q) q.docs.forEach(d => { out[d.id] = d.data(); }); return out;
  },
  async students() {
    await this.ready;
    if (this.mode === 'supa') {
      const { data } = await this.sb.from('profiles').select('id, name, updated_at').order('updated_at', { ascending: false });
      return (data || []).map(r => ({ id: r.id, name: r.name, updatedAt: r.updated_at }));
    }
    if (this.mode !== 'cloud') return [];
    const q = await this.call(() => this.db.collection('results').get());
    return q ? q.docs.map(d => ({ id: d.id, ...d.data() })) : [];
  },
  async studentResults(uid) {
    if (this.mode === 'supa') {
      const { data } = await this.sb.from('results').select('key, data').eq('user_id', uid);
      return rowsToMap(data);
    }
    const q = await this.call(() => this.db.collection('results/' + uid + '/ex').get());
    const out = {}; if (q) q.docs.forEach(d => { out[d.id] = d.data(); }); return out;
  },
  async saveFeedback(uid, key, doc) {
    if (this.mode === 'supa') {
      const { error } = await this.sb.from('feedback').upsert({ user_id: uid, key, data: doc, updated_at: doc.at });
      return !error;
    }
    return await this.call(() => this.db.doc('results/' + uid + '/fb/' + key).set(doc).then(() => true), () => false);
  }
};

const state = { topic: 'terveys', block: 'sanasto', view: 'learn', profile: null, results: {}, feedback: {}, cardGroup: 0, flips: {} };
try { const t = localStorage.getItem(LS_KEY + ':tab'); if (t) Object.assign(state, JSON.parse(t)); } catch (e) {}
const saveTab = () => { try { localStorage.setItem(LS_KEY + ':tab', JSON.stringify({ topic: state.topic, block: state.block })); } catch (e) {} };

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().replace(/[–—]/g, '-').replace(/[.,!?;:"«»()]/g, '').replace(/\s+/g, ' ').trim();
const key = (topic, ex) => topic + '__' + ex;
const words = s => (String(s).trim().match(/\S+/g) || []).length;
const topicObj = () => TOPICS.find(t => t.id === state.topic) || TOPICS[0];
const blockObj = () => { const t = topicObj(); return t.blocks.find(b => b.id === state.block) || t.blocks[0]; };
const fmtDate = iso => { try { return new Date(iso).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600); }
function scoreClass(s, m) { const p = m ? s / m : 0; return p >= .8 ? 'ok' : p >= .5 ? 'mid' : 'low'; }
// an exercise counts as finished once it is checked or sent; cards once every word is marked
const exDone = (ex, r) => !!r && (
  ex.type === 'cards' ? r.score >= r.max
  : ex.type === 'reading' ? !r.checked || r.checked.length >= ex.texts.length
  : ex.type === 'writing' ? ex.tasks.every(t => ((r.raw || {})[t.id] || '').trim())
  : true);
function blockScore(topic, block, res) {
  let s = 0, m = 0, done = 0, started = 0;
  block.exercises.forEach(ex => {
    const r = res[key(topic.id, ex.id)]; if (!r) return;
    started++; if (exDone(ex, r)) done++;
    if (r.max && ex.type !== 'cards') { s += r.score; m += r.max; }
  });
  return { s, m, done, started, total: block.exercises.length };
}
const sigOf = sc => sc.done === sc.total ? '●' : sc.started ? '◐' : '○';

const AUTH_ERR = m => /invalid login/i.test(m) ? 'Неверный email или пароль.'
  : /already registered|already been registered/i.test(m) ? 'Такой email уже зарегистрирован. Войдите.'
  : /at least 6|password should be/i.test(m) ? 'Пароль должен быть не короче 6 символов.'
  : /email not confirmed/i.test(m) ? 'Email ещё не подтверждён: откройте письмо от сайта и нажмите ссылку.'
  : /rate limit/i.test(m) ? 'Слишком много попыток, подождите немного.'
  : /failed to fetch|network/i.test(m) ? 'Нет связи с сервером. Проверьте интернет и попробуйте ещё раз.'
  : 'Ошибка: ' + m;

function renderAuth(el) {
  const mode = state.authMode || 'signup';
  if (state.checkEmail) {
    const email = state.checkEmail;
    el.innerHTML = `<section class="panel notice" role="status" aria-live="polite">
      <h3>✉ Проверьте почту</h3>
      <p>Мы отправили письмо на <b>${esc(email)}</b>.</p>
      <p>Откройте его и нажмите ссылку, чтобы подтвердить email. Потом вернитесь сюда и войдите.</p>
      <p class="note">Письмо не пришло? Подождите пару минут и проверьте папку «Спам» или «Промоакции».</p>
      <div class="row" style="margin-top:12px">
        <button class="btn main" type="button" id="toLogin">Email подтверждён, войти</button>
        <button class="btn" type="button" id="resend">Отправить письмо ещё раз</button>
      </div><p class="note" id="authMsg"></p></section>`;
    $('#toLogin').onclick = () => { state.checkEmail = null; state.authMode = 'login'; renderRegister(); const f = $('#authEmail'); if (f) f.value = email; };
    $('#resend').onclick = async () => {
      const { error } = await Store.sb.auth.resend({ type: 'signup', email, options: { emailRedirectTo: location.origin + location.pathname } });
      $('#authMsg').textContent = error ? AUTH_ERR(error.message) : 'Письмо отправлено ещё раз.';
    };
    return;
  }
  if (Store.recovery) {
    el.innerHTML = `<section class="panel"><h3>Новый пароль</h3>
      <form class="row" id="pwForm" style="margin-top:10px"><input class="field" id="pwNew" type="password" autocomplete="new-password" minlength="6" placeholder="Новый пароль" required>
      <button class="btn main" type="submit">Сохранить</button></form><p class="note" id="authMsg"></p></section>`;
    $('#pwForm').onsubmit = async e => { e.preventDefault();
      const { error } = await Store.sb.auth.updateUser({ password: $('#pwNew').value });
      if (error) { $('#authMsg').textContent = AUTH_ERR(error.message); return; }
      Store.recovery = false; toast('Пароль изменён'); renderAll(); };
    return;
  }
  el.innerHTML = `
    <section class="panel" aria-labelledby="regTitle">
      <div class="row" style="justify-content:space-between">
        <h3 id="regTitle">${mode === 'signup' ? 'Регистрация' : 'Вход'}</h3>
        <button class="btn small" type="button" id="authSwitch">${mode === 'signup' ? 'У меня уже есть аккаунт' : 'Зарегистрироваться'}</button>
      </div>
      <p>${mode === 'signup' ? 'Зарегистрируйтесь, чтобы результаты по каждому блоку сохранялись и преподаватель мог их проверить.' : 'Войдите, чтобы продолжить с того места, где остановились.'}</p>
      <form class="row" id="authForm" style="margin-top:10px">
        ${mode === 'signup' ? '<input class="field" id="authName" autocomplete="given-name" placeholder="Имя" maxlength="60" required>' : ''}
        <input class="field" id="authEmail" type="email" autocomplete="email" placeholder="Email" required>
        <input class="field" id="authPw" type="password" autocomplete="${mode === 'signup' ? 'new-password' : 'current-password'}" minlength="6" placeholder="Пароль (от 6 символов)" required>
        <button class="btn main" type="submit">${mode === 'signup' ? 'Зарегистрироваться' : 'Войти'}</button>
      </form>
      <p class="note" id="authMsg">${mode === 'login' ? '<button class="btn small" type="button" id="forgotBtn">Забыли пароль?</button>' : 'Можно начать без регистрации: результаты сохранятся в этом браузере и перенесутся в аккаунт, когда вы зарегистрируетесь.'}</p>
    </section>`;
  $('#authSwitch').onclick = () => { state.authMode = mode === 'signup' ? 'login' : 'signup'; renderRegister(); };
  const fb = $('#forgotBtn'); if (fb) fb.onclick = async () => {
    const email = $('#authEmail').value.trim(); const msg = $('#authMsg');
    if (!email) { msg.textContent = 'Сначала впишите email.'; return; }
    const { error } = await Store.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    msg.textContent = error ? AUTH_ERR(error.message) : 'Письмо со ссылкой для смены пароля отправлено на ' + email + '.';
  };
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    const msg = $('#authMsg'); const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
    const email = $('#authEmail').value.trim(), password = $('#authPw').value;
    try {
      if (mode === 'signup') {
        const name = $('#authName').value.trim();
        const { data, error } = await Store.sb.auth.signUp({ email, password, options: { data: { name }, emailRedirectTo: location.origin + location.pathname } });
        if (error) { msg.textContent = AUTH_ERR(error.message); return; }
        if (!data.session) { state.checkEmail = email; toast('Письмо отправлено на ' + email); renderRegister(); $('#register').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      } else {
        const { error } = await Store.sb.auth.signInWithPassword({ email, password });
        if (error) { msg.textContent = AUTH_ERR(error.message); return; }
      }
    } finally { btn.disabled = false; }
  };
}

function renderRegister() {
  const el = $('#register');
  if (Store.mode === 'supa') { if (Store.uid && !Store.recovery) { el.innerHTML = ''; return; } renderAuth(el); return; }
  const blocked = Store.mode === 'cloud' && Store.cloudBlocked;
  if (state.profile && !blocked) { el.innerHTML = ''; return; }
  if (state.profile && blocked) {
    el.innerHTML = `<div class="warn">Сохранить на сайте не получилось: у вас нет прав на запись. Результаты сохраняются в этом браузере. Попросите преподавателя пригласить вас по email с правом редактирования, а пока можно нажать «Копировать мои ответы» и отправить их.</div><br>`;
    return;
  }
  el.innerHTML = `
    <section class="panel" aria-labelledby="regTitle">
      <h3 id="regTitle">Регистрация</h3>
      <p>Напишите своё имя, чтобы ваши результаты по каждому блоку сохранялись и преподаватель видел, кто выполнил задания.</p>
      ${Store.mode === 'cloud' ? '' : '<p class="note">Сейчас страница открыта без входа, поэтому результаты сохранятся только в этом браузере.</p>'}
      <form class="row" id="regForm" style="margin-top:10px">
        <input class="field" id="regName" autocomplete="given-name" placeholder="Имя" maxlength="60" required>
        <button class="btn main" type="submit">Сохранить</button>
      </form>
    </section>`;
  $('#regForm').onsubmit = async e => {
    e.preventDefault();
    const name = $('#regName').value.trim(); if (!name) return;
    await Store.saveProfile(name);
    state.profile = { name };
    toast('Готово, ' + name + '!');
    renderAll();
  };
}

function renderTopics() {
  const el = $('#topics');
  el.innerHTML = `<ul class="toc">${TOPICS.map(t => {
    if (t.soon) return `<li class="toc-topic soon"><span class="sig">○</span>${esc(t.fi)} <span class="note">(tulossa)</span></li>`;
    const scs = t.blocks.map(bl => blockScore(t, bl, state.results));
    const done = scs.reduce((a, x) => a + x.done, 0), total = scs.reduce((a, x) => a + x.total, 0);
    const sig = done === total ? '●' : scs.some(x => x.started) ? '◐' : '○';
    return `<li class="toc-topic"><button class="topic-btn" type="button" data-topic="${t.id}" aria-current="${t.id === state.topic}"><span class="sig">${sig}</span>${esc(t.fi)}</button>
      <span class="toc-count">${done}/${total} tehtävää</span>
      <ul class="toc-blocks">${t.blocks.map((bl, i) => { const sc = scs[i];
        return `<li class="${sc.done === sc.total ? 'is-done' : ''}"><a href="#block-${bl.id}" data-jump="${t.id}:${bl.id}"><span class="sig">${sigOf(sc)}</span>${i + 1}. ${esc(bl.fi)}</a>
          <span class="toc-count">${sc.done}/${sc.total}${sc.m ? ` · ${sc.s}/${sc.m}` + " pistettä" : ''}${sc.done === sc.total ? ' · valmis' : ''}</span></li>`; }).join('')}</ul></li>`;
  }).join('')}</ul>
  <p class="toc-legend note">○ не начато · ◐ в процессе · ● закончено</p>`;
  el.querySelectorAll('[data-topic]').forEach(b => b.onclick = () => { state.topic = b.dataset.topic; state.view = 'learn'; saveTab(); renderAll(); });
  el.querySelectorAll('[data-jump]').forEach(a => a.onclick = e => {
    e.preventDefault(); const [tid, bid] = a.dataset.jump.split(':');
    const go = () => { const tgt = document.getElementById('block-' + bid); if (tgt) tgt.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
    if (state.topic !== tid || state.view !== 'learn') { state.topic = tid; state.view = 'learn'; saveTab(); renderAll(); }
    go();
  });
}

/* =========================================================
   LEARN VIEW
   ========================================================= */
function renderLearn() {
  const t = topicObj();
  const main = $('#main');
  main.innerHTML = `
    <div class="row" style="justify-content:space-between;align-items:flex-end;margin:10px 0 6px"><h1 class="topic-title"><span class="tape">${esc(t.fi)}</span></h1>
      <div class="row"><button class="btn" type="button" data-allfold="1">Свернуть всё</button><button class="btn" type="button" data-allfold="0">Развернуть всё</button></div></div>
    <p class="note" style="margin:0">Совет: выделите любое слово на странице и нажмите «+ В словарь» рядом с ним, чтобы добавить его в свой словарь.</p>
    ${t.blocks.map((bl, i) => `<section class="block ${isFolded('b:' + bl.id) ? 'collapsed' : ''}" id="block-${bl.id}">
      <div class="block-head"><h2 class="block-title"><span class="tape">${i + 1}. ${esc(bl.fi)}</span></h2>
      <button class="fold" type="button" data-fold="b:${bl.id}" aria-expanded="${!isFolded('b:' + bl.id)}" aria-label="Свернуть или развернуть раздел"></button></div>
      <div data-exlist="${bl.id}"></div></section>`).join('')}`;
  main.querySelectorAll('[data-allfold]').forEach(b => b.onclick = () => {
    const fold = b.dataset.allfold === '1';
    t.blocks.forEach(bl => { setFold('b:' + bl.id, fold); bl.exercises.forEach(ex => setFold('e:' + ex.id, false)); });
    renderLearn();
  });
  t.blocks.forEach(bl => {
    const list = main.querySelector(`[data-exlist="${bl.id}"]`);
    bl.exercises.forEach((ex, i) => {
      const sec = document.createElement('section'); sec.className = 'ex' + (isFolded('e:' + ex.id) ? ' collapsed' : ''); sec.id = 'ex-' + ex.id;
      list.appendChild(sec);
      ({ cards: renderCards, input: renderInput, reading: renderReading, writing: renderWriting })[ex.type](sec, ex, i + 1);
    });

}

function exHead(ex, n, r) {
  const sc = r && r.max && ex.type !== 'cards' ? `<span class="score ${scoreClass(r.score, r.max)}">${r.score}/${r.max}</span>`
    : ex.type === 'writing' && r ? `<span class="score ok">отправлено</span>` : '';
  const st = exDone(ex, r) ? '<span class="ex-state done">● выполнено</span>' : r ? '<span class="ex-state">◐ начато</span>' : '<span class="ex-state">○ не начато</span>';
  return `<div class="ex-head"><h3><span class="sig">Tehtävä ${n} ·</span> ${esc(ex.title)}</h3><div class="row">${st}${sc}<button class="fold" type="button" data-fold="e:${ex.id}" aria-label="Свернуть или развернуть задание"></button></div></div>
    <p class="ex-task">${esc(ex.task)}</p>`;
}
function savedLine(r) { return r ? `<span class="saved-note">сохранено ${fmtDate(r.at)}</span>` : ''; }

async function submit(ex, doc) {
  const t = topicObj(), b = t.blocks.find(bl => bl.exercises.includes(ex));
  const prevR = state.results[key(t.id, ex.id)];
  const at = new Date().toISOString();
  const hist = ((prevR && prevR.hist) || []).concat([{ at, score: doc.score || 0, max: doc.max || 0 }]).slice(-30);
  const full = { topic: t.id, topicName: t.fi, block: b.id, blockName: b.fi, ex: ex.id, exTitle: ex.title, type: ex.type, at, ...doc, hist };
  state.results[key(t.id, ex.id)] = full;
  if (!state.profile && Store.mode !== 'supa') { toast('Зарегистрируйтесь вверху страницы, чтобы результат сохранился'); return; }
  const cloud = await Store.saveResult(key(t.id, ex.id), full);
  toast(cloud ? 'Результат сохранён на сайте' : Store.mode === 'supa' && Store.uid ? 'Нет связи с сайтом. Ответ сохранён в браузере и отправится, когда появится интернет' : Store.mode === 'supa' ? 'Сохранено в браузере. Зарегистрируйтесь, чтобы результат увидел преподаватель' : 'Результат сохранён в этом браузере');
}

/* ---------- cards ---------- */
function renderCards(sec, ex, n) {
  sec.dataset.n = n;
  const k = key(state.topic, ex.id);
  const r = state.results[k];
  const known = new Set((r && r.known) || []);
  const all = ex.groups.flatMap(g => g.cards);
  sec.innerHTML = exHead(ex, n, r) + ex.groups.map(gr => {
    const left = gr.cards.filter(c => !known.has(c[0]));
    return `<div class="vgroup"><h4>${esc(gr.name)} <span class="note">· выучено ${gr.cards.length - left.length}/${gr.cards.length}</span></h4>
    ${left.length ? `<div class="cards">${left.map(c => {
      const id = c[0];
      return `<button class="card ${state.flips[id] ? 'flipped' : ''}" type="button" data-card="${esc(id)}" aria-label="${esc(c[0])}">
        <span class="card-in">
          <span class="face front" title="${esc(c[2] || '')}"><span class="w">${esc(c[0])}</span>${c[2] ? `<span class="g">${esc(c[2])}</span>` : ''}</span>
          <span class="face back"><span class="w">${esc(c[1])}</span>
            <span class="back-tools">
              <span class="knowbtn" role="button" tabindex="0" data-knowcard="${esc(id)}" data-ex="${ex.id}" title="Я знаю это слово" aria-label="Я знаю это слово">✓ <span class="long">Знаю слово</span><span class="short">Знаю</span></span>
              <span class="addw" role="button" tabindex="0" title="В мой словарь" data-addw="${esc(c[0].split(' + ')[0])}" data-tr="${esc(c[1])}">+</span>
            </span></span>
        </span></button>`; }).join('')}</div>` : '<p class="note">● Все слова этой группы выучены.</p>'}</div>`; }).join('') + `
    <div class="card-tools">
      <button class="btn small" type="button" data-flipall>Перевернуть все</button>
      ${known.size ? `<button class="btn small" type="button" data-reset>Вернуть все карточки (${known.size})</button>` : ''}
      <span class="note" style="margin-left:auto">Выучено: <b>${known.size}/${all.length}</b></span>
    </div>`;
  sec.querySelectorAll('[data-card]').forEach(b => b.onclick = () => {
    const id = b.dataset.card; state.flips[id] = !state.flips[id]; b.classList.toggle('flipped', state.flips[id]);
  });
  markDictCards();
  sec.querySelector('[data-flipall]').onclick = () => { const to = all.some(c => !known.has(c[0]) && !state.flips[c[0]]); all.forEach(c => state.flips[c[0]] = to); renderCards(sec, ex, n); };
  const rs = sec.querySelector('[data-reset]');
  if (rs) rs.onclick = async () => { await saveKnown(ex, []); state.flips = {}; renderCards(sec, ex, n); refreshTabs(); };
}
async function saveKnown(ex, list) {
  const total = ex.groups.reduce((a, g) => a + g.cards.length, 0);
  await submit(ex, { score: list.length, max: total, known: list, answers: [{ p: 'Выучено карточек', a: list.length + ' из ' + total, ok: null }] });
}
// "I know this word": confirm once (unless turned off), then the card disappears
const SKIP_KNOW = LS_KEY + ':skipKnowConfirm';
function confirmKnow(word, go) {
  let skip = false; try { skip = localStorage.getItem(SKIP_KNOW) === '1'; } catch (e) {}
  if (skip) { go(); return; }
  let m = $('#knowModal');
  if (!m) { m = document.createElement('div'); m.id = 'knowModal'; m.className = 'modal'; document.body.appendChild(m); }
  m.hidden = false;
  m.innerHTML = `<div class="modal-in" role="dialog" aria-modal="true" aria-labelledby="kmT">
    <h3 id="kmT">Убрать карточку «${esc(word)}»?</h3>
    <p>Карточка исчезнет из списка и будет считаться выученной. Вернуть все карточки можно кнопкой «Вернуть все карточки» под словами.</p>
    <label class="row" style="gap:8px;margin:10px 0 4px"><input type="checkbox" id="kmSkip"> Больше не показывать это окно</label>
    <div class="row" style="margin-top:12px"><button class="btn main" type="button" id="kmOk">Убрать карточку</button><button class="btn" type="button" id="kmNo">Отмена</button></div>
  </div>`;
  const close = () => { m.hidden = true; };
  $('#kmNo').onclick = close;
  m.onclick = e => { if (e.target === m) close(); };
  $('#kmOk').onclick = () => { if ($('#kmSkip').checked) { try { localStorage.setItem(SKIP_KNOW, '1'); } catch (e) {} } close(); go(); };
  $('#kmOk').focus();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-knowcard]'); if (!b) return;
  e.stopPropagation(); e.preventDefault();
  const word = b.dataset.knowcard, exId = b.dataset.ex;
  const ex = topicObj().blocks.flatMap(bl => bl.exercises).find(x => x.id === exId);
  const sec = document.getElementById('ex-' + exId);
  confirmKnow(word, async () => {
    const card = b.closest('.card'); if (card) card.classList.add('leaving');
    const r = state.results[key(state.topic, exId)];
    const list = [...new Set([...((r && r.known) || []), word])];
    delete state.flips[word];
    await new Promise(res => setTimeout(res, 250));
    await saveKnown(ex, list);
    renderCards(sec, ex, +sec.dataset.n); refreshTabs();
  });
}, true);

/* ---------- input (fill-in) ---------- */
function renderInput(sec, ex, n) {
  const k = key(state.topic, ex.id);
  const r = state.results[k];
  const prev = r && r.raw ? r.raw : [];
  const checked = !!(r && r.raw);
  sec.innerHTML = exHead(ex, n, r) +
    (ex.bank ? `<details class="bank"><summary>Показать банк слов</summary><div class="bank-words">${[...ex.bank].sort((a, b) => a.localeCompare(b, 'fi')).map(w => `<span>${esc(w)}</span>`).join('')}</div></details>` : '') +
    `<ol class="items">${ex.items.map((it, i) => {
      const inp = `<input class="blank ${it.box ? 'wide' : ''}" id="${ex.id}-${i}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ответ ${i + 1}" value="${esc(prev[i] || '')}">`;
      const body = it.box ? `<div class="symptoms">${esc(it.box)}</div>${inp}`
        : esc(it.t).replace('___', inp) + (it.h ? ` <span class="hint">(${esc(it.h)})</span>` : '');
      return `<li><div class="it-body">${body}<span class="fb" id="${ex.id}-fb-${i}"></span></div></li>`; }).join('')}</ol>
    <div class="actions">
      <button class="btn main" type="button" data-check>Tarkista!</button>
      <button class="btn" type="button" data-show>Näytä vastaukset</button>
      <button class="btn" type="button" data-clear>Очистить</button>
      ${savedLine(r)}
    </div>`;
  const check = async (save) => {
    let score = 0; const answers = [], raw = [];
    ex.items.forEach((it, i) => {
      const inp = sec.querySelector('#' + ex.id + '-' + i);
      const v = inp.value; raw.push(v);
      const ok = it.a.some(a => norm(a) === norm(v));
      if (ok) score++;
      inp.classList.toggle('ok', ok); inp.classList.toggle('bad', !ok);
      const fb = sec.querySelector('#' + ex.id + '-fb-' + i);
      fb.className = 'fb ' + (ok ? 'ok' : 'bad');
      fb.innerHTML = ok ? '✓ верно' + (it.why ? ` <span class="why">· ${esc(it.why)}</span>` : '')
        : `✗ правильно: <b>${esc(it.a.join(' / '))}</b>` + (it.why ? ` <span class="why">· ${esc(it.why)}</span>` : '');
      answers.push({ p: it.box || (it.t + (it.h ? ' (' + it.h + ')' : '')), a: v, ok, c: it.a.join(' / ') });
    });
    if (save) { await submit(ex, { score, max: ex.items.length, answers, raw }); renderInput(sec, ex, n); refreshTabs(); }
  };
  if (checked) check(false);
  sec.querySelector('[data-check]').onclick = () => check(true);
  sec.querySelector('[data-show]').onclick = () => ex.items.forEach((it, i) => {
    const fb = sec.querySelector('#' + ex.id + '-fb-' + i);
    fb.className = 'fb wait'; fb.innerHTML = `ответ: <b>${esc(it.a.join(' / '))}</b>` + (it.why ? ` <span class="why">· ${esc(it.why)}</span>` : '');
  });
  sec.querySelector('[data-clear]').onclick = () => {
    sec.querySelectorAll('.blank').forEach(i => { i.value = ''; i.classList.remove('ok', 'bad'); });
    sec.querySelectorAll('.fb').forEach(f => { f.textContent = ''; f.className = 'fb'; });
  };
  sec.querySelectorAll('.blank').forEach((inp, i, all) => inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); (all[i + 1] || sec.querySelector('[data-check]')).focus(); }
  }));
}

/* ---------- YKI reading ---------- */
function renderReading(sec, ex, n) {
  const k = key(state.topic, ex.id);
  const r = state.results[k];
  const prev = (r && r.raw) || {};
  let drafts = {}; try { drafts = JSON.parse(localStorage.getItem(LS_KEY + ':draft:' + k)) || {}; } catch (e) {}
  const vals = { ...prev, ...drafts };
  // older results were checked all at once
  const checked = new Set(r && r.raw ? (r.checked || ex.texts.map((_, i) => i)) : []);
  const qs = []; ex.texts.forEach((tx, ti) => tx.questions.forEach(q => qs.push({ q, ti, id: `${ex.id}-q${qs.length}` })));
  sec.innerHTML = exHead(ex, n, r) + ex.texts.map((tx, ti) => `
    <div class="section-title"><span class="n">Teksti ${ti + 1}</span></div>
    <article class="yki-text"><div class="kind">${esc(tx.kind)}</div><h4>${esc(tx.title)}</h4>${tx.body.map(p => `<p>${esc(p)}</p>`).join('')}</article>
    ${qs.filter(x => x.ti === ti).map(({ q, id }) => { const num = qs.findIndex(x => x.id === id) + 1; const v = vals[id];
      if (q.kind === 'mc') return `<fieldset class="q" style="border:0;padding:0" id="${id}"><legend class="qt">${num}. ${esc(q.q)}</legend><div class="opts">${q.options.map((o, oi) =>
        `<label class="opt" data-oi="${oi}"><input type="radio" name="${id}" value="${oi}" ${String(v) === String(oi) ? 'checked' : ''}><span>${'abc'[oi]}) ${esc(o)}</span></label>`).join('')}</div><span class="fb"></span></fieldset>`;
      if (q.kind === 'tf') return `<fieldset class="q" style="border:0;padding:0" id="${id}"><legend class="qt">${num}. ${esc(q.q)}</legend><div class="tf">
        <label class="opt" data-oi="1"><input type="radio" name="${id}" value="1" ${v === '1' ? 'checked' : ''}><span>Oikein</span></label>
        <label class="opt" data-oi="0"><input type="radio" name="${id}" value="0" ${v === '0' ? 'checked' : ''}><span>Väärin</span></label></div><span class="fb"></span></fieldset>`;
      return `<div class="q" id="${id}"><label class="qt" for="${id}-t">${num}. ${esc(q.q)}</label><textarea id="${id}-t" rows="2">${esc(v || '')}</textarea><span class="fb"></span></div>`;
    }).join('')}
    <div class="actions part-actions"><button class="btn main" type="button" data-check="${ti}">Tarkista! · Teksti ${ti + 1}</button>
      ${checked.has(ti) ? `<span class="saved-note">● проверено и сохранено ${r && r.parts && r.parts[ti] ? fmtDate(r.parts[ti]) : fmtDate(r.at)}</span>` : '<span class="saved-note">○ ещё не проверено</span>'}</div>`).join('');
  const readVal = ({ q, id }) => {
    const box = sec.querySelector('#' + id);
    if (q.kind === 'open') return box.querySelector('textarea').value;
    const sel = box.querySelector('input:checked'); return sel ? sel.value : null;
  };
  // keep unsent answers in this browser while typing
  const keepDraft = () => { const d = {}; qs.forEach(x => { d[x.id] = readVal(x); }); try { localStorage.setItem(LS_KEY + ':draft:' + k, JSON.stringify(d)); } catch (e) {} };
  sec.oninput = keepDraft; sec.onchange = keepDraft;
  const grade = (set) => {
    let score = 0, max = 0; const answers = [];
    qs.forEach(x => {
      const { q, id, ti } = x; if (!set.has(ti)) return;
      const box = sec.querySelector('#' + id); const fb = box.querySelector('.fb'); const v = readVal(x);
      if (q.kind === 'open') {
        const nv = norm(v); const need = q.need || q.keys.length;
        const hit = Math.min(need, q.keys.filter(alts => alts.some(a => nv.includes(norm(a)))).length);
        score += hit; max += need;
        fb.className = 'fb ' + (hit === need ? 'ok' : 'wait');
        fb.innerHTML = `${hit}/${need} по ключевым словам · пример ответа: <i>${esc(q.model)}</i> <span class="why">· преподаватель проверит ответ</span>`;
        answers.push({ p: q.q, a: v, ok: hit === need, c: q.model, open: true });
        return;
      }
      max++;
      const correct = q.kind === 'mc' ? String(q.answer) : (q.answer ? '1' : '0');
      const ok = v === correct; if (ok) score++;
      box.querySelectorAll('.opt').forEach(o => { o.classList.remove('ok', 'bad'); if (o.dataset.oi === correct) o.classList.add('ok'); else if (o.dataset.oi === v) o.classList.add('bad'); });
      fb.className = 'fb ' + (ok ? 'ok' : 'bad'); fb.textContent = ok ? '✓ oikein' : (v == null ? '✗ нет ответа' : '✗ väärin');
      const label = y => q.kind === 'mc' ? (y == null ? '—' : 'abc'[y] + ') ' + q.options[y]) : (y == null ? '—' : y === '1' ? 'Oikein' : 'Väärin');
      answers.push({ p: q.q, a: label(v), ok, c: label(correct) });
    });
    return { score, max, answers };
  };
  if (checked.size) grade(checked);
  sec.querySelectorAll('[data-check]').forEach(btn => btn.onclick = async () => {
    const ti = +btn.dataset.check; const set = new Set([...checked, ti]);
    const raw = { ...prev }; qs.forEach(x => { if (x.ti === ti) raw[x.id] = readVal(x); });
    const parts = { ...((r && r.parts) || {}) }; parts[ti] = new Date().toISOString();
    const res = grade(set);
    await submit(ex, { ...res, raw, checked: [...set].sort(), parts });
    renderReading(sec, ex, n); refreshTabs();
  });
}

/* ---------- YKI writing ---------- */
const timer = { end: 0, h: null };
function renderWriting(sec, ex, n) {
  const k = key(state.topic, ex.id);
  const r = state.results[k];
  const prev = (r && r.raw) || {};
  const savedAt = (r && r.savedAt) || {};
  let drafts = {}; try { drafts = JSON.parse(localStorage.getItem(LS_KEY + ':draft:' + k)) || {}; } catch (e) {}
  const fb = state.feedback[k] || null;
  sec.innerHTML = exHead(ex, n, null) + `
    <div class="row" style="margin-bottom:8px"><button class="btn small" type="button" id="timerBtn">⏱ Запустить таймер ${ex.minutes} мин</button><span class="timer" id="timerOut"></span></div>
    ${ex.tasks.map((t, i) => { const v = drafts[t.id] != null ? drafts[t.id] : (prev[t.id] || ''); const f = fb && fb.items && fb.items[t.id];
      const sent = (prev[t.id] || '').trim(); const changed = drafts[t.id] != null && drafts[t.id] !== (prev[t.id] || '');
      return `<div class="wtask">
      <div class="section-title" style="margin-top:0"><span class="n">Tehtävä ${i + 1}</span><b>${esc(t.kind)}</b></div>
      <p style="margin:0 0 4px;max-width:65ch"><b>${esc(t.title)}.</b> ${esc(t.text)}</p>
      <ul>${t.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
      <textarea id="${ex.id}-${t.id}" rows="7" aria-label="${esc(t.title)}" data-tid="${t.id}" data-min="${t.words[0]}" data-max="${t.words[1]}">${esc(v)}</textarea>
      <div class="wmeta"><span class="count" id="${ex.id}-${t.id}-c"></span><span>рекомендуемый объём ${t.words[0]}–${t.words[1]} слов</span></div>
      <div class="actions part-actions"><button class="btn main" type="button" data-send="${t.id}">Tallenna · Tehtävä ${i + 1}</button>
        <span class="saved-note" id="${ex.id}-${t.id}-st">${sent ? (changed ? '◐ есть несохранённые изменения' : '● сохранено ' + fmtDate(savedAt[t.id] || r.at)) : '○ ещё не сохранено'}</span></div>
      ${f && (f.grade || f.comment) ? `<div class="teacher-fb"><b>Отзыв преподавателя</b>${f.grade ? ` · уровень <b>${esc(f.grade)}</b>` : ''}<div style="white-space:pre-wrap">${esc(f.comment || '')}</div></div>` : ''}
    </div>`; }).join('')}`;
  const upd = ta => { const c = words(ta.value); const el = sec.querySelector('#' + ta.id + '-c'); el.textContent = c + ' слов'; el.classList.toggle('good', c >= +ta.dataset.min && c <= +ta.dataset.max); };
  sec.querySelectorAll('textarea').forEach(ta => { upd(ta); ta.addEventListener('input', () => {
    upd(ta); drafts[ta.dataset.tid] = ta.value; try { localStorage.setItem(LS_KEY + ':draft:' + k, JSON.stringify(drafts)); } catch (e) {}
    const st = sec.querySelector('#' + ta.id + '-st'); if (st) st.textContent = '◐ есть несохранённые изменения'; }); });
  const tick = () => { const left = Math.max(0, timer.end - Date.now()); const out = $('#timerOut'); if (!out) return;
    out.textContent = timer.end ? `${String(Math.floor(left / 60000)).padStart(2, '0')}:${String(Math.floor(left / 1000) % 60).padStart(2, '0')}` : '';
    if (timer.end && !left) { clearInterval(timer.h); toast('Время вышло!'); } };
  sec.querySelector('#timerBtn').onclick = () => { timer.end = Date.now() + ex.minutes * 60000; clearInterval(timer.h); timer.h = setInterval(tick, 1000); tick(); };
  tick(); if (timer.end > Date.now()) { clearInterval(timer.h); timer.h = setInterval(tick, 1000); }
  sec.querySelectorAll('[data-send]').forEach(btn => btn.onclick = async () => {
    const tid = btn.dataset.send; const v = sec.querySelector('#' + ex.id + '-' + tid).value;
    if (!v.trim()) { toast('Сначала напишите текст'); return; }
    const raw = { ...prev, [tid]: v }; const sa = { ...savedAt, [tid]: new Date().toISOString() };
    const answers = ex.tasks.filter(t => (raw[t.id] || '').trim()).map(t => ({ p: t.kind + ': ' + t.title, a: raw[t.id], ok: null, words: words(raw[t.id]), tid: t.id }));
    await submit(ex, { score: 0, max: 0, answers, raw, savedAt: sa, pending: true });
    delete drafts[tid]; try { localStorage.setItem(LS_KEY + ':draft:' + k, JSON.stringify(drafts)); } catch (e) {}
    renderWriting(sec, ex, n); refreshTabs();
  });
}

/* ---------- small fireworks when a whole block is finished ---------- */
function doneBlockIds() {
  const out = new Set();
  TOPICS.forEach(t => t.blocks.forEach(b => { const sc = blockScore(t, b, state.results); if (sc.total && sc.done === sc.total) out.add(t.id + ':' + b.id); }));
  return out;
}
function celebrateNewlyDone() {
  const now = doneBlockIds(); const before = state.doneBlocks;
  state.doneBlocks = now;
  if (!before) return;
  const fresh = [...now].filter(id => !before.has(id)); if (!fresh.length) return;
  const [tid, bid] = fresh[0].split(':'); const b = TOPICS.find(t => t.id === tid).blocks.find(x => x.id === bid);
  toast('Раздел «' + b.fi + '» закончен! Hienoa!');
  fireworks();
}
function fireworks() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas'); cv.className = 'fw';
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; document.body.appendChild(cv);
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const colors = ['#b9e094', '#f7c2b5', '#d8c8ef', '#fad4a6', '#8cc56a', '#f19bb0'];
  const parts = [];
  const burst = (x, y) => { for (let i = 0; i < 46; i++) { const a = Math.random() * Math.PI * 2, v = 1.5 + Math.random() * 3.6;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, c: colors[i % colors.length], r: 1.6 + Math.random() * 1.8 }); } };
  [[.3, .32, 0], [.7, .26, 280], [.5, .42, 560]].forEach(([fx, fy, d]) => setTimeout(() => burst(W * fx, H * fy), d));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    parts.forEach(p => { p.vy += .05; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.life -= .012;
      if (p.life > 0) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); } });
    if (t - t0 < 2400) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

function reportText(name, res) {
  const lines = ['Suomi-muistikirja — ' + name, ''];
  Object.keys(res).filter(k => k[0] !== '_').map(k => res[k]).sort((a, b) => (a.at < b.at ? -1 : 1)).forEach(r => {
    lines.push(`## ${r.topicName} · ${r.blockName} · ${r.exTitle}` + (r.max ? ` — ${r.score}/${r.max}` : '') + ` (${fmtDate(r.at)})`);
    (r.answers || []).forEach((a, i) => lines.push(`${i + 1}. ${a.p}\n   → ${a.a || '—'}${a.ok === false ? '  [✗ ' + a.c + ']' : a.ok ? '  [✓]' : ''}`));
    lines.push('');
  });
  return lines.join('\n');
}
async function exportMine() {
  const text = reportText(state.profile ? state.profile.name : '', state.results);

async function addWord(word, tr, pos) {

// select a word (the normal way, also on phones) → a button appears → add to dictionary

  if (!node || !node.closest('#main') || node.closest('input, textarea, #wsheet')) return '';
  const t = String(sel).replace(/\s+/g, ' ').trim().replace(/^[^\p{L}]+|[^\p{L}]+$/gu, '');

// the bubble sits right above the selection (below it on touch screens, where the phone's own copy menu takes the space above)
function placeBubble(btn) {
  const sel = window.getSelection(); if (!sel.rangeCount) return;
  const rect = sel.getRangeAt(0).getBoundingClientRect();
  const below = window.matchMedia('(pointer: coarse)').matches;
  btn.classList.toggle('below', below);
  const bw = btn.offsetWidth, bh = btn.offsetHeight, gap = 12;
  let left = rect.left + rect.width / 2 - bw / 2;
  left = Math.max(8, Math.min(left, document.documentElement.clientWidth - bw - 8));
  let top = below ? rect.bottom + gap : rect.top - bh - gap;
  if (!below && top < 8) { top = rect.bottom + gap; btn.classList.add('below'); }
  btn.style.left = (left + window.scrollX) + 'px';
  btn.style.top = (top + window.scrollY) + 'px';
  btn.style.setProperty('--tail', (rect.left + rect.width / 2 - left) + 'px');
}
