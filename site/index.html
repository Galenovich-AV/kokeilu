/* =========================================================
   TRAINING (in the dictionary view)
   A dictionary word is learned in three rounds: every exercise right once,
   again after 3 days, again after a week. Any mistake sends it back to the start.
   stage 0 = learning, 1 = wait 3 days, 2 = wait a week, 3 = learned; ex = exercises done this round.
   ========================================================= */
const DAY = 864e5;
const MODES = ['match', 'write', 'letter'];
const POS = [['noun', 'существительное'], ['verb', 'глагол'], ['adj', 'прилагательное'], ['other', 'другое']];
const POS_FI = { noun: 'Substantiivit', verb: 'Verbit', adj: 'Adjektiivit', other: 'Muut' };
const CARD_POS = { 'kipeä': 'adj', 'vuotaa': 'verb', 'kutista': 'verb', 'tutkia': 'verb', 'kuunnella': 'verb', 'mitata': 'verb', 'hoitaa': 'verb',
  'ottaa lääkettä': 'verb', 'käydä lääkärissä': 'verb', 'kirjoittaa resepti': 'verb', 'voida hyvin / huonosti': 'verb' };
function cardPos(group, fi) { const base = fi.split(' + ')[0]; return CARD_POS[base] || (group === 'Verbit ja rektiot' ? 'verb' : 'noun'); }
function guessPos(word) {
  const w = norm(word); if (!w) return 'noun';
  for (const t of TOPICS) for (const b of t.blocks) for (const ex of b.exercises) if (ex.type === 'cards')
    for (const g of ex.groups) for (const c of g.cards) if (norm(c[0].split(' + ')[0]) === w) return cardPos(g.name, c[0]);
  if (/(ea|eä|kas|käs|ton|tön|ias|iäs)$/.test(w)) return 'adj';
  if (/(da|dä|aa|ää|ia|iä|oa|ua|yä|lla|llä|nna|nnä|rra|rrä)$/.test(w) && !/inen$/.test(w)) return 'verb';
  return 'noun';
}
const posName = w => (POS.find(x => x[0] === (w.p || guessPos(w.w))) || POS[0])[1];
const stageOf = w => w.stage || 0;
const isDue = w => stageOf(w) === 0 || ((stageOf(w) === 1 || stageOf(w) === 2) && (!w.due || Date.now() >= new Date(w.due).getTime()));
const isLearned = w => stageOf(w) >= 3;
const fmtDay = iso => { try { return new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' }); } catch (e) { return ''; } };
function wordStatus(w) {
  const st = stageOf(w), done = MODES.filter(m => (w.ex || {})[m]).length;
  if (st >= 3) return '<span class="learned">● выучено</span>';
  const round = ['', 'повтор 1 (через 3 дня)', 'повтор 2 (через неделю)'][st];
  if (st > 0 && !isDue(w)) return `◔ ${round}: с ${fmtDay(w.due)}`;
  return `◐ ${st ? round + ' · ' : ''}упражнения ${done}/3`;
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function trainPool(src) {
  if (src === 'dict') return dictWords().filter(w => (w.t || '').trim()).map(w => ({ fi: w.w, ru: w.t, dict: true, p: w.p || guessPos(w.w), due: isDue(w), learned: isLearned(w) }));
  const t = TOPICS.find(x => x.id === src); if (!t) return [];
  const out = [];
  t.blocks.forEach(b => b.exercises.forEach(ex => { if (ex.type === 'cards') ex.groups.forEach(g => g.cards.forEach(c => out.push({ fi: c[0].split(' + ')[0], ru: c[1], p: cardPos(g.name, c[0]), due: true }))); }));
  return out;
}
const TRAIN_MODES = [['match', 'Yhdistä', 'соедини слово и перевод'], ['write', 'Kirjoita suomeksi', 'напиши слово по-фински'], ['letter', 'Puuttuva kirjain', 'вставь пропущенную букву']];
function newRound() {
  const tr = state.train; const pool = trainPool(tr.src);
  const fresh = shuffle(pool.filter(x => x.due && !x.learned)), old = shuffle(pool.filter(x => x.learned));
  if (tr.mode === 'match') {
    // one board per part of speech; a learned word may come back for review
    const boards = [];
    ['noun', 'verb', 'adj', 'other'].forEach(p => {
      const f = fresh.filter(x => x.p === p).slice(0, 4), o = old.filter(x => x.p === p).slice(0, f.length ? 1 : 2);
      const pick = shuffle(f.concat(o)); if (pick.length < 2) return;
      boards.push({ p, pick, left: shuffle(pick.map((x, i) => i)), right: shuffle(pick.map((x, i) => i)), sel: null, done: [], bad: null, miss: {} });
    });
    tr.round = { boards, miss: 0, saved: false };
  } else {
    const items = fresh.slice(0, 10).map(x => {
      if (tr.mode !== 'letter') return x;
      const pos = [...x.fi].map((ch, i) => /\p{L}/u.test(ch) ? i : -1).filter(i => i >= 0);
      return { ...x, gap: pos[Math.floor(Math.random() * pos.length)] };
    });
    tr.round = { items, i: 0, score: 0, answered: false, last: null, log: {} };
  }
}
async function recordTraining(mode, log) {
  // log: { word: true (right) / false (wrong) } — only words from the dictionary
  const keys = Object.keys(log); if (!keys.length) return [];
  const moved = [];
  const words = dictWords().map(w => {
    if (!(w.w in log)) return w;
    const v = { ...w, ex: { ...(w.ex || {}) } };
    if (!log[w.w]) { if (stageOf(w) > 0 || MODES.some(m => v.ex[m])) moved.push(w.w + ' → снова учим'); return { ...v, stage: 0, ex: {}, due: null }; }
    if (isLearned(w) || !isDue(w)) return w;
    v.ex[mode] = true;
    if (MODES.every(m => v.ex[m])) {
      const st = stageOf(w) + 1; v.stage = st; v.ex = {};
      v.due = st === 1 ? new Date(Date.now() + 3 * DAY).toISOString() : st === 2 ? new Date(Date.now() + 7 * DAY).toISOString() : null;
      moved.push(w.w + (st === 3 ? ' → выучено ●' : st === 1 ? ' → повтор через 3 дня' : ' → повтор через неделю'));
    }
    return v;
  });
  await saveDict(words);
  return moved;
}
function nextReview() {
  const ds = dictWords().filter(w => !isLearned(w) && !isDue(w) && w.due).map(w => w.due).sort();
  return ds[0] || null;
}
const hideTrainHelp = () => { try { return localStorage.getItem(LS_KEY + ':hideTrainHelp') === '1'; } catch (e) { return false; } };
function nextModeBtn(mode) {
  const i = TRAIN_MODES.findIndex(m => m[0] === mode); const nx = TRAIN_MODES[(i + 1) % TRAIN_MODES.length];
  return `<button class="btn" type="button" data-nextmode="${nx[0]}">Следующее задание: ${nx[1]} →</button>`;
}
function renderTrain() {
  const sec = $('#trainSec'); if (!sec) return;
  const tr = state.train || (state.train = { mode: 'match', src: null, chosen: false, round: null });
  if (!tr.chosen) { const auto = dictWords().filter(w => (w.t || '').trim()).length >= 4 ? 'dict' : state.topic; if (auto !== tr.src) { tr.src = auto; tr.round = null; } }
  const pool = trainPool(tr.src);
  const srcOpts = [['dict', 'Мой словарь']].concat(TOPICS.filter(t => !t.soon).map(t => [t.id, t.fi]));
  const freshN = pool.filter(x => x.due && !x.learned).length;
  let body = '';
  if (!freshN) {
    const nr = tr.src === 'dict' && nextReview();
    body = `<p class="note">${tr.src === 'dict' && pool.length
      ? 'Сейчас нечего тренировать: все слова выучены или ждут повторения.' + (nr ? ' Следующее повторение: <b>' + fmtDay(nr) + '</b>.' : '')
      : 'В «Моём словаре» пока нет слов с переводом. Добавьте слова или выберите тему.'}</p>`;
    tr.round = null;
  } else {
    if (!tr.round) newRound();
    const R = tr.round;
    if (tr.mode === 'match') {
      if (!R.boards.length) body = '<p class="note">Для «Yhdistä» нужно хотя бы 2 слова одной части речи. Попробуйте другое упражнение.</p>';
      else {
        const finished = R.boards.every(B => B.done.length === B.pick.length);
        body = R.boards.map((B, bi) => `<div class="board"><h4 class="board-h">${POS_FI[B.p]} <span class="note">· ${(POS.find(x => x[0] === B.p) || [])[1]}</span></h4>
          <div class="match">
          <div class="mcol">${B.left.map(i => `<button type="button" class="mbtn ${B.done.includes(i) ? 'done' : ''} ${B.sel === i ? 'sel' : ''} ${B.bad && B.bad[0] === i ? 'bad' : ''}" data-ml="${bi}:${i}" ${B.done.includes(i) ? 'disabled' : ''}>${esc(B.pick[i].fi)}${B.pick[i].learned ? ' <span class="oldw" title="Уже выученное слово">●</span>' : ''}</button>`).join('')}</div>
          <div class="mcol">${B.right.map(i => `<button type="button" class="mbtn ${B.done.includes(i) ? 'done' : ''} ${B.bad && B.bad[1] === i ? 'bad' : ''}" data-mr="${bi}:${i}" ${B.done.includes(i) ? 'disabled' : ''}>${esc(B.pick[i].ru)}</button>`).join('')}</div></div></div>`).join('')
          + (finished ? `<p class="tr-res">Valmista! Ошибок: <b>${R.miss}</b></p>${R.moved && R.moved.length ? `<p class="note">${R.moved.map(esc).join('<br>')}</p>` : ''}<div class="row"><button class="btn main" type="button" data-again>Новый раунд</button>${nextModeBtn(tr.mode)}</div>`
            : '<p class="note">Нажмите на финское слово, потом на его перевод. ● отмечены уже выученные слова для повторения.</p>');
      }
    } else {
      const it = R.items[R.i];
      if (!it) {
        body = `<p class="tr-res">Valmista! Правильно: <b>${R.score} из ${R.items.length}</b></p>${R.moved && R.moved.length ? `<p class="note">${R.moved.map(esc).join('<br>')}</p>` : ''}<div class="row"><button class="btn main" type="button" data-again>Новый раунд</button>${nextModeBtn(tr.mode)}</div>`;
      } else {
        const prompt = tr.mode === 'write'
          ? `<div class="tr-q">${esc(it.ru)}</div>`
          : `<div class="tr-q">${[...it.fi].map((ch, i) => i === it.gap ? `<span class="gap">${R.answered ? esc(ch) : '_'}</span>` : esc(ch)).join('')}</div><div class="note">${esc(it.ru)}</div>`;
        const L = R.last;
        body = `<div class="note">${R.i + 1} / ${R.items.length}</div>${prompt}
          <form class="row" id="trForm" style="margin-top:10px">
            <input class="field ${tr.mode === 'letter' ? 'one' : ''}" id="trIn" autocomplete="off" autocapitalize="off" spellcheck="false" ${tr.mode === 'letter' ? 'maxlength="1"' : ''} ${R.answered ? 'disabled' : ''} placeholder="${tr.mode === 'letter' ? '?' : 'suomeksi'}" value="${esc(L && R.answered ? L.given : '')}">
            ${R.answered ? '<button class="btn main" type="button" data-next>Дальше →</button>' : '<button class="btn main" type="submit">Tarkista!</button>'}
          </form>
          ${R.answered ? `<p class="fb ${L.ok ? 'ok' : 'bad'}">${L.ok ? '✓ oikein' : '✗ правильно: <b>' + esc(L.right) + '</b>' + (it.dict ? ' <span class="why">· слово вернулось к изучению</span>' : '')}</p>` : ''}`;
      }
    }
  }
  sec.innerHTML = `<div class="ex-head"><h3>Harjoittelu</h3></div>
    ${hideTrainHelp() ? '' : `<div class="help-note"><p class="ex-task" style="margin:0">Слово из «Моего словаря» становится выученным в три шага: правильно сделайте с ним все три упражнения, потом ещё раз через 3 дня и ещё раз через неделю.</p>
      <label class="note row" style="gap:6px;margin-top:6px"><input type="checkbox" id="trHelpOff"> Больше не показывать</label></div>`}
    <div class="row" style="margin-bottom:10px">${TRAIN_MODES.map(([id, fi, ru]) => `<button type="button" class="btn small ${tr.mode === id ? 'main' : ''}" data-mode="${id}" title="${ru}">${fi}</button>`).join('')}</div>
    <div class="row" style="margin-bottom:14px"><label class="note" for="trSrc">Слова:</label>
      <select class="field" id="trSrc" style="flex:0 1 auto">${srcOpts.map(([v, l]) => `<option value="${v}" ${tr.src === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>
      <span class="note">${TRAIN_MODES.find(m => m[0] === tr.mode)[2]}</span></div>
    <div class="tr-area">${body}</div>`;
  const ho = $('#trHelpOff'); if (ho) ho.onchange = () => { try { localStorage.setItem(LS_KEY + ':hideTrainHelp', '1'); } catch (e) {} renderTrain(); };
  sec.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { tr.mode = b.dataset.mode; tr.round = null; renderTrain(); });
  $('#trSrc').onchange = e => { tr.src = e.target.value; tr.chosen = true; tr.round = null; renderTrain(); };
  const again = sec.querySelector('[data-again]'); if (again) again.onclick = () => { tr.round = null; renderTrain(); };
  const nm = sec.querySelector('[data-nextmode]'); if (nm) nm.onclick = () => { tr.mode = nm.dataset.nextmode; tr.round = null; renderTrain(); sec.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  if (!tr.round) return;
  const R = tr.round;
  if (tr.mode === 'match') {
    sec.querySelectorAll('[data-ml]').forEach(b => b.onclick = () => { const [bi, i] = b.dataset.ml.split(':').map(Number); const B = R.boards[bi]; B.sel = i; B.bad = null; renderTrain(); });
    sec.querySelectorAll('[data-mr]').forEach(b => b.onclick = async () => {
      const [bi, j] = b.dataset.mr.split(':').map(Number); const B = R.boards[bi];
      if (B.sel == null) { toast('Сначала выберите финское слово'); return; }
      if (j === B.sel) { B.done.push(j); B.sel = null; B.bad = null; }
      else { R.miss++; B.miss[B.sel] = true; B.bad = [B.sel, j]; }
      if (!R.saved && R.boards.every(x => x.done.length === x.pick.length)) {
        R.saved = true; const log = {};
        R.boards.forEach(x => x.pick.forEach((it, i) => { if (it.dict) log[it.fi] = !x.miss[i]; }));
        R.moved = await recordTraining('match', log); renderDict(); return;
      }
      renderTrain();
    });
  } else if (R.items[R.i]) {
    const f = $('#trForm'), inp = $('#trIn');
    if (!R.answered) setTimeout(() => inp.focus(), 30);
    if (f) f.onsubmit = e => {

    };

}

function renderProgress() {
  const sec = $('#progSec'); if (!sec) return;
  const dw = dictWords();
  const bar = (a, b) => `<div class="pbar" role="img" aria-label="${a} из ${b}"><span style="width:${b ? Math.round(a / b * 100) : 0}%"></span></div>`;
  const rows = TOPICS.filter(t => !t.soon).map(t => {
    let known = 0, total = 0;
    t.blocks.forEach(b => b.exercises.forEach(ex => { if (ex.type !== 'cards') return;
      total += ex.groups.reduce((a, g) => a + g.cards.length, 0);
      const r = state.results[key(t.id, ex.id)]; known += ((r && r.known) || []).length; }));
    const mine = dw.filter(w => w.topic === t.id), mineL = mine.filter(isLearned).length;
    return `<div class="prow"><div class="prow-h"><b>${esc(t.fi)}</b><span class="note">карточки: выучено <b>${known}</b> из ${total}</span></div>${bar(known, total)}
      <div class="note" style="margin-top:4px">мой словарь: ${mine.length} слов из этой темы, выучено ${mineL}</div></div>`;
  }).join('');
  const learned = dw.filter(isLearned).length, waiting = dw.filter(w => !isLearned(w) && !isDue(w)).length;
  sec.innerHTML = `<div class="ex-head"><h3>Tilasto</h3></div>
    <p class="ex-task">Сколько слов выучено по каждой теме.</p>
    ${rows}
    <div class="prow"><div class="prow-h"><b>Мой словарь</b><span class="note">выучено <b>${learned}</b> из ${dw.length}${waiting ? ` · ждут повторения: ${waiting}` : ''}</span></div>${bar(learned, dw.length)}</div>`;
}

function shrinkImage(file) {

    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const S = 160, cv = document.createElement('canvas'); cv.width = cv.height = S;
      const k = Math.max(S / img.width, S / img.height), w = img.width * k, h = img.height * k;
      cv.getContext('2d').drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
      URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg', .85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('bad image')); };
    img.src = url;
  });
}
function goToExercise(topicId, exId) {
  const t = TOPICS.find(x => x.id === topicId); if (!t) return;
  const b = t.blocks.find(bl => bl.exercises.some(e => e.id === exId));
  state.topic = topicId; state.view = 'learn'; saveTab();
  if (b) setFold('b:' + b.id, false); setFold('e:' + exId, false);
  renderAll();
  const el = document.getElementById('ex-' + exId); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
function renderProfile() {
  const main = $('#main'); const d = profDoc(); const name = state.profile ? state.profile.name : '';
  // gather every task that has a result
  const rows = [];
  TOPICS.forEach(t => t.blocks.forEach(b => b.exercises.forEach((ex, i) => {
    const r = state.results[key(t.id, ex.id)]; if (!r) return;
    rows.push({ t, b, ex, n: i + 1, r, tries: (r.hist || []).length || 1 });
  })));
  const graded = rows.filter(x => x.ex.type !== 'cards' && x.ex.type !== 'writing' && x.r.max);
  const S = graded.reduce((a, x) => a + x.r.score, 0), M = graded.reduce((a, x) => a + x.r.max, 0);
  const tries = rows.filter(x => x.ex.type !== 'cards').reduce((a, x) => a + x.tries, 0);
  const allTotal = TOPICS.reduce((a, t) => a + t.blocks.reduce((c, b) => c + b.exercises.length, 0), 0);
  const doneN = rows.filter(x => exDone(x.ex, x.r)).length;
  const dw = dictWords();
  const last = rows.map(x => x.r.at).sort().pop();
  const bar = p => `<div class="pbar"><span style="width:${p}%"></span></div>`;
  const blocks = [];
  TOPICS.forEach(t => t.blocks.forEach(b => {
    const g = rows.filter(x => x.b === b && x.ex.type !== 'cards' && x.ex.type !== 'writing' && x.r.max);
    if (!g.length) return;
    const s = g.reduce((a, x) => a + x.r.score, 0), m = g.reduce((a, x) => a + x.r.max, 0);
    blocks.push(`<div class="prow"><div class="prow-h"><b>${esc(t.fi)} · ${esc(b.fi)}</b><span class="note"><b>${pct(s, m)}%</b> правильно · ${s}/${m}</span></div>${bar(pct(s, m))}</div>`);
  }));
  const list = rows.slice().sort((a, b) => (a.r.at < b.r.at ? 1 : -1)).map(x => {
    const p = x.ex.type === 'cards' ? `${x.r.score}/${x.r.max} слов` : x.ex.type === 'writing' ? `${(x.r.answers || []).length}/${x.ex.tasks.length} текстов` : `${pct(x.r.score, x.r.max)}% · ${x.r.score}/${x.r.max}`;
    const cls = x.ex.type === 'writing' || x.ex.type === 'cards' ? '' : scoreClass(x.r.score, x.r.max);
    return `<li class="hist-row"><div class="hist-main"><b>${esc(x.ex.title)}</b><span class="note">${esc(x.t.fi)} · ${esc(x.b.fi)} · Tehtävä ${x.n}</span></div>
      <div class="hist-meta"><span class="hist-score ${cls}">${p}</span><span class="note">${fmtDate(x.r.at)}${x.ex.type !== 'cards' ? ' · попыток: ' + x.tries : ''}</span></div>
      <button class="btn small" type="button" data-goto="${x.t.id}:${x.ex.id}">Открыть</button></li>`;
  }).join('');
  main.innerHTML = `
    <section class="ex prof-card">
      <div class="prof-head">
        <div class="prof-av">${avatarHTML(96)}</div>
        <div class="prof-id">
          <h1 class="topic-title" style="font-size:2.6rem">${esc(name || 'Профиль')}</h1>
          <p class="note">${last ? 'последнее задание ' + fmtDate(last) : 'Заданий пока нет'}</p>
          <div class="row" style="margin-top:8px">
            <label class="btn small" for="avFile">${d.img ? 'Сменить фото' : 'Загрузить фото'}</label>
            <input type="file" id="avFile" accept="image/*" hidden>
            ${d.img ? '<button class="btn small" type="button" id="avDel">Убрать фото</button>' : ''}
            <button class="btn small" type="button" id="nameEdit">Изменить имя</button>
          </div>
          ${d.img ? '' : `<div class="swatches" role="radiogroup" aria-label="Цвет аватарки">${AV_COLORS.map(c => `<button type="button" class="sw ${(d.color || AV_COLORS[0]) === c ? 'on' : ''}" style="background:${c}" data-color="${c}" role="radio" aria-checked="${(d.color || AV_COLORS[0]) === c}" aria-label="Цвет ${c}"></button>`).join('')}</div>`}
          <form class="row" id="nameForm" hidden style="margin-top:8px"><input class="field" id="nameIn" value="${esc(name)}" maxlength="60" required><button class="btn small main" type="submit">Сохранить</button></form>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><span class="stat-n">${M ? pct(S, M) + '%' : '—'}</span><span class="note">правильных ответов в тестах</span></div>
        <div class="stat"><span class="stat-n">${doneN}<small>/${allTotal}</small></span><span class="note">заданий выполнено</span></div>
        <div class="stat"><span class="stat-n">${tries}</span><span class="note">попыток всего</span></div>
        <div class="stat"><span class="stat-n">${dw.filter(isLearned).length}<small>/${dw.length}</small></span><span class="note">слов выучено в словаре</span></div>
      </div>
    </section>
    <section class="ex">
      <div class="ex-head"><h3>Правильность по разделам</h3></div>
      ${blocks.join('') || '<p class="note">Проверьте хотя бы одно задание, и здесь появится процент правильных ответов.</p>'}
    </section>
    <section class="ex">
      <div class="ex-head"><h3>Мои задания</h3></div>
      <p class="ex-task">Когда выполнено и с каким результатом. «Открыть» переносит прямо к заданию, чтобы посмотреть ответы.</p>
      ${list ? `<ul class="hist">${list}</ul>` : '<p class="note">Пока пусто.</p>'}
    </section>`;
  main.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => { const [t, e] = b.dataset.goto.split(':'); goToExercise(t, e); });
  main.querySelectorAll('[data-color]').forEach(b => b.onclick = async () => { await saveProf({ color: b.dataset.color }); renderWho(); renderProfile(); });
  $('#avFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const img = await shrinkImage(f); await saveProf({ img }); toast('Фото сохранено'); renderWho(); renderProfile(); }
    catch (err) { toast('Не получилось открыть картинку. Попробуйте JPG или PNG'); }
  };
  const del = $('#avDel'); if (del) del.onclick = async () => { await saveProf({ img: null }); renderWho(); renderProfile(); };
  $('#nameEdit').onclick = () => { $('#nameForm').hidden = false; $('#nameIn').focus(); };
  $('#nameForm').onsubmit = async e => { e.preventDefault(); const v = $('#nameIn').value.trim(); if (!v) return; await Store.saveProfile(v); state.profile = { ...(state.profile || {}), name: v }; toast('Имя сохранено'); renderAll(); };
}

/* =========================================================
   BOOT
   ========================================================= */
function renderAll() {
  document.documentElement.classList.toggle('dict-mode', state.view === 'dict');
  document.documentElement.classList.toggle('teacher-mode', state.view === 'teacher' && Store.isOwner);
  document.documentElement.classList.toggle('profile-mode', state.view === 'profile');
  renderWho(); renderTopics(); renderRegister();
  if (state.view === 'teacher' && Store.isOwner) renderTeacher(); else if (state.view === 'dict') renderDict(); else if (state.view === 'profile') renderProfile(); else renderLearn();
}

state.results = lsRead().results || {};
state.doneBlocks = doneBlockIds();
state.profile = lsRead().profile || null;
if (!topicObj().blocks.some(b => b.id === state.block)) state.block = topicObj().blocks[0].id;
renderAll();

async function loadMine() {
  const [p, res] = await Promise.all([Store.getProfile(), Store.myResults()]);
  state.profile = p; state.results = res;
  state.feedback = Store.online() ? await Store.feedbackFor(Store.uid) : {};
  state.doneBlocks = doneBlockIds();
  renderAll();
}
Store.ready = Store.init();
Store.ready.then(loadMine).then(() => Store.flushPending());
window.addEventListener('online', () => Store.flushPending());
</script>

</body>
